name: Deploy DevX to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.12.1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Build Scramjet WASM
        run: |
          cd packages/core/rewriter/wasm
          cargo build --release --target wasm32-unknown-unknown
          mkdir -p ../../dist
          cp target/wasm32-unknown-unknown/release/libwasm.wasm ../../dist/scramjet.wasm

      - name: Build Scramjet core
        run: pnpm --filter @mercuryworkshop/scramjet build

      - name: Build Scramjet controller
        run: pnpm --filter @mercuryworkshop/scramjet-controller build

      - name: Build DevX
        run: pnpm --filter @mercuryworkshop/scramjet-demo build

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: packages/demo/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
